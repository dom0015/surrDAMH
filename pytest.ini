[pytest]
testpaths = tests
# bare `pytest` = unit + validation (~1.5 min); MPI tests only on request: `./run_tests.sh mpi`
# or `pytest -m mpi` (an explicit -m on the command line overrides this default)
addopts = -m "not mpi"
markers =
    unit: fast pure-Python tests, no MPI beyond size-1 COMM_WORLD, no real filesystem beyond tmp_path (seconds)
    validation: statistical validation against closed-form/known posteriors on toy problems (minutes)
    mpi: tests that spawn mpiexec subprocesses; run under timeout, may be slow
